<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageDB - Enterprise Listings</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PapaParse for robust CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <header>
        <h1>StageDB</h1>
        <p>List of available internship opportunities and company contacts.</p>
    </header>

    <main>
        <div id="loading" class="status-message">Loading data...</div>
        <div id="error" class="status-message error-message" style="display: none;">Error loading data. Please check the spreadsheet publication.</div>
        
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th class="status-col">Applied</th>
                        <th>Email</th>
                        <th>Nom Entreprise</th>
                        <th>Site Web</th>
                        <th>Nom Recruteur</th>
                        <th>Description</th>
                        <th>Page LinkedIn</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Data will be injected here -->
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 StageDB</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
